<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.3" />
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6" stroke-opacity="0.6"/>
  
  <!-- Center Barber Scissors & Razor Icon -->
  <g filter="url(#glow)">
    <!-- Scissor Loop 1 -->
    <circle cx="196" cy="340" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <!-- Scissor Loop 2 -->
    <circle cx="316" cy="340" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    
    <!-- Blade 1 -->
    <path d="M210 315 L320 160 C330 145 320 135 305 145 L245 235" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Blade 2 -->
    <path d="M302 315 L192 160 C182 145 192 135 207 145 L267 235" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Scissor Pivot Pin -->
    <circle cx="256" cy="245" r="9" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>

    <!-- Small Barber Comb on Top -->
    <rect x="180" y="115" width="152" height="18" rx="6" fill="url(#goldGrad)"/>
    <rect x="190" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="204" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="218" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="232" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="246" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="260" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="274" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="288" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="302" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
    <rect x="316" y="133" width="6" height="20" rx="2" fill="url(#goldGrad)"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#f59e0b" letter-spacing="4">BARBER TURNOS</text>
</svg>
