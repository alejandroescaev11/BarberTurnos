<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chrome / Steel Blade Gradient -->
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Sharp Bevel Edge Gradient -->
    <linearGradient id="edgeGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Barber Pole Brass / Gold Cap Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Glass 3D Cylinder Specular Highlight -->
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <filter id="poleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#dc2626" flood-opacity="0.3" />
    </filter>

    <!-- Clip Path for Barber Pole Cylinder (Width 52, Height 184) -->
    <clipPath id="poleCylinderClip">
      <rect x="230" y="142" width="52" height="184" rx="6" />
    </clipPath>
  </defs>

  <!-- 1. Background Badge -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="url(#goldRim)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Decorative Vintage Barber Rings -->
  <circle cx="256" cy="235" r="182" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.5" />
  <circle cx="256" cy="235" r="172" fill="none" stroke="url(#goldRim)" stroke-width="2" stroke-opacity="0.3" />

  <!-- 2. LA CUCHILLA CLÁSICA DE AFEITAR (Razor Blade) -->
  <!-- Diagonal crossing element behind the pole -->
  <g transform="translate(256, 234) rotate(-32) translate(-140, -65)" filter="url(#bladeGlow)">
    <!-- Blade Outer Body -->
    <path d="
      M 20 0 
      L 260 0 
      A 12 12 0 0 1 272 12 
      L 272 26 
      A 8 8 0 0 0 280 34 
      L 280 96 
      A 8 8 0 0 0 272 104 
      L 272 118 
      A 12 12 0 0 1 260 130 
      L 20 130 
      A 12 12 0 0 1 8 118 
      L 8 104 
      A 8 8 0 0 0 0 96 
      L 0 34 
      A 8 8 0 0 0 8 26 
      L 8 12 
      A 12 12 0 0 1 20 0 
      Z" 
      fill="url(#bladeSteel)" 
      stroke="#64748b" 
      stroke-width="2.5" 
    />

    <!-- Top Beveled Hone Edge -->
    <rect x="24" y="3" width="232" height="7" rx="2" fill="url(#edgeGleam)" />
    <!-- Bottom Beveled Hone Edge -->
    <rect x="24" y="120" width="232" height="7" rx="2" fill="url(#edgeGleam)" />

    <!-- Corner Relief Notches (Typical Safety Razor Cutouts) -->
    <path d="M 22 2 L 2 22 M 258 2 L 278 22 M 2 108 L 22 128 M 278 108 L 258 128" stroke="#475569" stroke-width="2" />

    <!-- Central Geometric Slot Cutout (Distinctive Razor Blade Slot) -->
    <!-- Center circle + Keyway slots + Side circles -->
    <g fill="#0b0f19" stroke="#475569" stroke-width="2">
      <!-- Main Horizontal Center Slot -->
      <rect x="58" y="60" width="164" height="10" rx="3" />
      
      <!-- Central Large Circle -->
      <circle cx="140" cy="65" r="19" />
      
      <!-- Middle Keyway Rectangles -->
      <rect x="133" y="44" width="14" height="42" rx="2" />

      <!-- Left Circle Notch -->
      <circle cx="85" cy="65" r="10" />

      <!-- Right Circle Notch -->
      <circle cx="195" cy="65" r="10" />
    </g>

    <!-- Razor Blade Details & Laser Etchings -->
    <text x="75" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#475569" letter-spacing="2">STAINLESS</text>
    <text x="180" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="900" fill="#475569" letter-spacing="2">PLATINUM</text>
    <text x="140" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="800" fill="#64748b" letter-spacing="3">BARBER BLADE</text>
    <path d="M 45 42 L 65 42 M 215 42 L 235 42" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 3. EL BASTÓN DE BARBERÍA (Barber Pole) -->
  <!-- Centered vertical cylinder with classic Red, White and Blue helical stripes -->
  <g filter="url(#dropShadow)">
    
    <!-- Top Finial: Brass Ball / Sphere -->
    <g filter="url(#poleGlow)">
      <circle cx="256" cy="108" r="22" fill="url(#brassGrad)" stroke="#92400e" stroke-width="1.5" />
      <ellipse cx="250" cy="102" rx="7" ry="5" fill="#ffffff" fill-opacity="0.65" />
    </g>

    <!-- Top Brass Crown / Mount -->
    <path d="
      M 230 142 
      L 224 133 
      C 224 125 240 122 256 122 
      C 272 122 288 125 288 133 
      L 282 142 
      Z" 
      fill="url(#brassGrad)" 
      stroke="#92400e" 
      stroke-width="1.5" 
    />
    <ellipse cx="256" cy="142" rx="27" ry="5" fill="#fef08a" stroke="#d97706" stroke-width="1" />

    <!-- Glass Cylinder Background -->
    <rect x="229" y="142" width="54" height="184" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />

    <!-- Helical Stripes Group (Clipped to cylinder body) -->
    <g clip-path="url(#poleCylinderClip)">
      <!-- Pure White Base -->
      <rect x="220" y="130" width="80" height="210" fill="#ffffff" />

      <!-- Diagonal Stripes (Red, Blue, Red, Blue...) -->
      <!-- We render repeating angled ribbons across the height -->
      <!-- Ribbon 1: Red -->
      <polygon points="210,130 310,80 310,105 210,155" fill="#dc2626" />
      <!-- Ribbon 2: Blue -->
      <polygon points="210,165 310,115 310,140 210,190" fill="#1d4ed8" />
      <!-- Ribbon 3: Red -->
      <polygon points="210,200 310,150 310,175 210,225" fill="#dc2626" />
      <!-- Ribbon 4: Blue -->
      <polygon points="210,235 310,185 310,210 210,260" fill="#1d4ed8" />
      <!-- Ribbon 5: Red -->
      <polygon points="210,270 310,220 310,245 210,295" fill="#dc2626" />
      <!-- Ribbon 6: Blue -->
      <polygon points="210,305 310,255 310,280 210,330" fill="#1d4ed8" />
      <!-- Ribbon 7: Red -->
      <polygon points="210,340 310,290 310,315 210,365" fill="#dc2626" />
      <!-- Ribbon 8: Blue -->
      <polygon points="210,375 310,325 310,350 210,400" fill="#1d4ed8" />

      <!-- Glass 3D Cylinder Shading Overlay -->
      <rect x="230" y="142" width="52" height="184" fill="url(#glassShine)" />
      
      <!-- Cylindrical Glass Highlight Line -->
      <rect x="235" y="144" width="5" height="180" rx="2.5" fill="#ffffff" fill-opacity="0.75" />
      <rect x="274" y="144" width="3" height="180" rx="1.5" fill="#000000" fill-opacity="0.2" />
    </g>

    <!-- Cylinder Glass Outline Ring Borders -->
    <rect x="230" y="142" width="52" height="184" rx="6" fill="none" stroke="#64748b" stroke-width="2" stroke-opacity="0.7" />

    <!-- Bottom Brass Collar & Base Mount -->
    <ellipse cx="256" cy="326" rx="27" ry="5" fill="#fef08a" stroke="#d97706" stroke-width="1" />
    <path d="
      M 229 326 
      L 223 336 
      C 223 346 238 350 256 350 
      C 274 350 289 346 289 336 
      L 283 326 
      Z" 
      fill="url(#brassGrad)" 
      stroke="#92400e" 
      stroke-width="1.5" 
    />
    
    <!-- Bottom Acorn / Finial Drop -->
    <circle cx="256" cy="358" r="9" fill="url(#brassGrad)" stroke="#92400e" stroke-width="1.5" />
  </g>

  <!-- 4. Vintage Barber Stars & Crossed Cutlines -->
  <g fill="#f59e0b">
    <polygon points="120,235 123,242 131,243 125,248 127,256 120,251 113,256 115,248 109,243 117,242" opacity="0.85" />
    <polygon points="392,235 395,242 403,243 397,248 399,256 392,251 385,256 387,248 381,243 389,242" opacity="0.85" />
  </g>

  <!-- 5. BRAND TYPOGRAPHY: BARBERTURNO -->
  <g id="brandText">
    <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="4">
      BARBER<tspan fill="#ef4444">TURNO</tspan>
    </text>
    <text x="256" y="452" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f59e0b" letter-spacing="5">
      ★ CITAS &amp; TURNOS ★
    </text>
  </g>
</svg>
